name: 13-node 96GB 12s topology counterfactual
on:
  push:
    branches:
      - experiments/13-node-96gb-12s-20261008
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - model: qwen
            agents: 600
            variant: memory_x2
          - model: qwen
            agents: 600
            variant: network_x2
          - model: qwen
            agents: 600
            variant: compute_x2
          - model: qwen
            agents: 600
            variant: memory_half
          - model: deepseek
            agents: 160
            variant: memory_x2
          - model: deepseek
            agents: 160
            variant: network_x2
          - model: deepseek
            agents: 160
            variant: compute_x2
          - model: deepseek
            agents: 160
            variant: memory_half
          - model: qwen
            agents: 200
            variant: baseline
          - model: deepseek
            agents: 60
            variant: baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate topology and simulate 12 seconds (measure 10)
        run: python run_mac_studio_m5_ultra_13node_12s.py --model ${{ matrix.model }} --agents ${{ matrix.agents }} --variant ${{ matrix.variant }} --seconds 12 --warmup 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 13node-${{ matrix.model }}-${{ matrix.agents }}-${{ matrix.variant }}
          path: results/13_node_96gb/*.json
          if-no-files-found: warn
