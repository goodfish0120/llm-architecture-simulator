name: test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python run_simulator.py --ms 2 --window-ms 1 --warmup-ms 0
      - run: python -m pip install -e .
      - run: llm-architecture-simulator --ms 2 --window-ms 1 --warmup-ms 0
