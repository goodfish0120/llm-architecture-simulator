<!doctype html><meta charset="utf-8"><title>LLM architecture diagnostic replay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif;overflow:hidden}header{height:52px;padding:10px 16px;background:#182235;display:flex;gap:12px;align-items:center}button,input{accent-color:#60a5fa}button{background:#26354d;color:#e5e7eb;border:1px solid #52637e;border-radius:4px;padding:5px 9px}#time{width:320px}#canvas{height:calc(100vh - 52px);position:relative;background:radial-gradient(#22304a 1px,transparent 1px);background-size:20px 20px}.panel{position:absolute;background:#172033ee;border:1px solid #4b5c78;border-radius:7px;min-width:230px;min-height:120px;resize:both;overflow:auto;box-shadow:0 8px 28px #0008}.title{cursor:move;padding:8px 10px;font-weight:650;background:#24324b;position:sticky;top:0;z-index:2}.body{padding:9px}.row{padding:3px 0;border-bottom:1px solid #283750}.muted{color:#94a3b8}.bar{height:13px;background:#25344f;border-radius:3px;position:relative;margin:6px 0}.span{position:absolute;height:100%;background:#38bdf8;border-radius:3px}.shared{background:#a78bfa}.expert{background:#f59e0b}.transfer{background:#34d399}.selected{outline:2px solid #fbbf24}.tree button{padding:0 4px;margin-right:3px}.notice{color:#fbbf24;font-size:12px}.lane{height:20px;background:#0f172a;margin:5px 0;position:relative;border-radius:3px}.lane i{position:absolute;top:3px;height:14px;border-radius:2px}.reserved{background:#64748b}.productive{background:#22c55e;top:6px!important;height:8px!important}.legend{font-size:12px;color:#cbd5e1}
</style>
<header><strong>Diagnostic replay</strong><input id="file" type="file" accept="application/json"><button id="play">Play</button><button id="step">Next transition</button><button id="clear">All tokens</button><label>time <input id="time" type="range" min="0" max="1" value="0"></label><span id="clock"></span><span id="capture" class="notice"></span><span class="notice">Model trace, not hardware telemetry. Correlation is not proof of cause.</span></header>
<main id="canvas"></main>
<script>
let trace, t=0, selectedToken=null, timer; const treeCollapsed={}, layoutPrefix='llm-diagnostic-layout-v1:'; const $=id=>document.getElementById(id), canvas=$('canvas'); window.toggleTree=(button,key)=>{treeCollapsed[key]=!treeCollapsed[key];button.parentNode.querySelector('.modules').hidden=treeCollapsed[key];button.textContent=treeCollapsed[key]?'+':'−'};
function ns(v){return (v/1e6).toFixed(3)+' ms'} function range(){let a=[...trace.events,...trace.batches,...trace.transfers].map(x=>x.time_ns??x.ready_time_ns);return [Math.min(...a),Math.max(...a)]}
function panel(id,title,left,top,w,h,draw){let saved;try{saved=JSON.parse(localStorage.getItem(layoutPrefix+id))}catch(_){saved=null}let e=document.createElement('section');e.className='panel';e.id=id;e.style.cssText=`left:${saved?.left??left}px;top:${saved?.top??top}px;width:${saved?.width??w}px;height:${saved?.height??h}px;z-index:${saved?.zIndex??''}`;e.innerHTML=`<div class="title">${title} <button data-pin>${saved?.zIndex?'unpin':'pin'}</button><button data-duplicate>duplicate</button></div><div class="body"></div>`;canvas.append(e);let save=()=>{if(!id.includes('-copy-'))localStorage.setItem(layoutPrefix+id,JSON.stringify({left:e.offsetLeft,top:e.offsetTop,width:e.offsetWidth,height:e.offsetHeight,zIndex:e.style.zIndex}))};new ResizeObserver(save).observe(e);let ox,oy; e.querySelector('.title').onpointerdown=x=>{if(x.target.dataset.pin!==undefined||x.target.dataset.duplicate!==undefined)return;ox=x.clientX-e.offsetLeft;oy=x.clientY-e.offsetTop;e.setPointerCapture(x.pointerId);e.onpointermove=y=>{e.style.left=Math.max(0,y.clientX-ox)+'px';e.style.top=Math.max(0,y.clientY-oy-52)+'px'};e.onpointerup=()=>{e.onpointermove=null;save()}};e.querySelector('[data-pin]').onclick=x=>{e.style.zIndex=e.style.zIndex==='10'?'':'10';x.target.textContent=e.style.zIndex?'unpin':'pin';save()};e.querySelector('[data-duplicate]').onclick=()=>{let copy=panel(id+'-copy-'+Date.now(),title+' copy',e.offsetLeft+24,e.offsetTop+24,e.offsetWidth,e.offsetHeight,draw);copy.draw()};e.draw=()=>draw(e.querySelector('.body'));return e}
function visible(xs){return xs.filter(x=>(x.time_ns??x.ready_time_ns??x.start_ns)<=t)} function owns(x){return !selectedToken||x.units?.some(u=>u.token_id===selectedToken)} function transitionTimes(){return [...new Set([...trace.events,...trace.batches,...trace.transfers,...trace.tokens].flatMap(x=>[x.time_ns??x.ready_time_ns,x.completion_time_ns,x.arrival_time_ns]).filter(Number.isFinite))].sort((a,b)=>a-b)}
function draw(){if(!trace)return; $('clock').textContent=ns(t)+(selectedToken===null?'':' · token '+selectedToken);$('clear').disabled=selectedToken===null;[...canvas.children].forEach(x=>x.draw());}
function build(){canvas.innerHTML='';let [lo,hi]=range();$('time').min=lo;$('time').max=hi;$('time').value=lo;t=lo;
panel('topology','Machines / logical modules',12,12,320,380,b=>{let layers=trace.manifest.configuration.model_layers;let tokenNote=selectedToken===null?'':'<div class=notice>Cross-panel filter: token '+selectedToken+'</div>';b.innerHTML=tokenNote+'<div class=tree>'+Array.from({length:trace.manifest.configuration.node_count},(_,n)=>`<div><button onclick="toggleTree(this,'machine-${n}')">${treeCollapsed['machine-'+n]?'+':'−'}</button>Machine ${n}<div class=modules ${treeCollapsed['machine-'+n]?'hidden':''}><span class=muted>compute + memory</span><br>sequence owners: agents ${[...Array(trace.manifest.configuration.continuously_active_agent_count).keys()].filter(a=>a%trace.manifest.configuration.node_count===n).join(', ')}</div></div>`).join('')+'<hr>'+layers.map((l,i)=>`<div><button onclick="toggleTree(this,'layer-${i}')">${treeCollapsed['layer-'+i]?'+':'−'}</button>Layer ${i}: ${l.routed_expert_count?'MoE '+l.routed_expert_count+' / top-'+l.selected_expert_count_per_token:'dense-only'}<div class=modules ${treeCollapsed['layer-'+i]?'hidden':''}>shared stage always present</div></div>`).join('')+'</div>'});
panel('timeline','Layer/type timeline',346,12,610,270,b=>{let batches=visible(trace.batches).filter(owns);let width=560;b.innerHTML=batches.slice(-70).map(x=>{let L=((x.time_ns-lo)/(hi-lo))*width,end=Math.min(t,x.completion_time_ns),W=Math.max(2,(end-x.time_ns)/(hi-lo)*width),phase=t<x.completion_time_ns?'executing':'finished';return `<div class=bar title="${x.kind} L${x.layer}; queue ${x.queue_depth_before_execution}; ${phase}"><i class="span ${x.kind}" style="left:${L}px;width:${W}px"></i>${x.kind} L${x.layer} ${x.expert_index===null?'':`expert ${x.expert_index}`} (${x.units.length}) · ${phase}</div>`}).join('')||'<span class=muted>No captured work before seek time.</span>'});
panel('agents','Per-agent phases / token identity',12,404,480,280,b=>{let es=visible(trace.events).flatMap(e=>e.units.map(u=>({...u,e}))).filter(x=>!selectedToken||x.token_id===selectedToken).slice(-90);let by={};es.forEach(x=>(by[x.agent_id]??=[]).push(x));b.innerHTML=Object.entries(by).map(([a,xs])=>`<div class=row>agent ${a}: ${xs.slice(-4).map(x=>`<button data-t=${x.token_id}>T${x.token_id}</button> ${x.e.type} L${x.e.layer}`).join(' → ')}</div>`).join('')||'<span class=muted>No captured agent phase before seek time.</span>';b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{selectedToken=+x.dataset.t;draw()})});
panel('evidence','Queues, allocations, and wait evidence',508,300,448,384,b=>{let bs=visible(trace.batches).filter(owns);let ts=visible(trace.transfers).filter(owns);let rs=visible(trace.resources);b.innerHTML=`<div><b>Batch starts:</b> ${bs.length}; <b>Transfers:</b> ${ts.length}; <b>resource intervals seen:</b> ${rs.length}</div>`+bs.slice(-12).reverse().map(x=>`<div class=row>${x.kind} L${x.layer} @ machine ${x.node_id}: batch ${x.units.length}, queue before ${x.queue_depth_before_execution}, latest-ready → service-start ${(x.time_ns-x.ready_time_ns).toFixed(0)} ns; reserved execution ${(x.completion_time_ns-x.time_ns).toFixed(0)} ns</div>`).join('')+ts.slice(-4).reverse().map(x=>`<div class=row>${x.kind} transfer ${x.source_node_id}→${x.destination_node_id}: ${x.resource_names?.join(' → ')||'local/no link'}</div>`).join('')+`<hr><div class=muted>"Latest-ready → service-start" is not a per-token wait total. Resource intervals are model reservations and are not token-attributed. Parallel branches are separate and are not summed as token latency. Missing records are not inferred.</div>`});
panel('resources','Resource interval lanes',970,12,560,500,b=>{let width=500,by={};trace.resources.forEach(x=>(by[x.resource]??=[]).push(x));b.innerHTML='<div class=legend>gray: reserved; green: productive; gray without green: model wait. Blank lane is unreserved. Link lanes are directional. Intervals are clipped at the shared seek time and have no token attribution.</div>'+Object.entries(by).map(([name,items])=>{let active=items.filter(x=>x.start_ns<=t);return `<div class=row>${name}<div class=lane>${active.map(x=>{let left=(x.start_ns-lo)/(hi-lo)*width,end=Math.min(t,x.end_ns),w=Math.max(1,(end-x.start_ns)/(hi-lo)*width);return `<i class="${x.kind}" style="left:${left}px;width:${w}px"></i>`}).join('')}</div></div>`}).join('')||'<span class=muted>No resource intervals captured.</span>'});
}
function loadTrace(data){trace=data;selectedToken=null;$('capture').textContent=trace.capture_complete?'':'Incomplete trace: missing detail is not inferred.';build();draw()}
function step(){if(!trace)return;let next=transitionTimes().find(x=>x>t);if(next===undefined){clearInterval(timer);timer=null;t=+$('time').min;$('play').textContent='Replay';}else{t=next;$('play').textContent='Pause';}$('time').value=t;draw()}
$('file').onchange=e=>{let r=new FileReader;r.onload=()=>loadTrace(JSON.parse(r.result));r.readAsText(e.target.files[0])};let traceUrl=new URLSearchParams(location.search).get('trace');if(traceUrl)fetch(traceUrl).then(r=>r.json()).then(loadTrace).catch(()=>alert('Could not load trace URL; use the file picker instead.'));$('time').oninput=e=>{t=+e.target.value;draw()};$('step').onclick=step;$('clear').onclick=()=>{selectedToken=null;draw()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='Play';return}if(t>=+$('time').max)t=+$('time').min;$('play').textContent='Pause';timer=setInterval(step,80)};
</script>
